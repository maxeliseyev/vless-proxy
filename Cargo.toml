[package]
name = "vproxy"
version = "0.5.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["rustls-tls"] }
rustls = "0.23"
tokio-rustls = "0.26"
rustls-native-certs = "0.8"
webpki-roots = "0.26"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
base64 = "0.22"
serde_json = "1"
tempfile = "3"
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
hmac = "0.12"
x509-parser = "0.16"
aws-lc-rs = "1"
libc = "0.2"
ratatui = "0.30"
crossterm = "0.29"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[patch.crates-io]
# vproxy fork of rustls 0.23: adds ClientConfig::session_id_hook for REALITY.
# Branch reality-0.23, pinned to the commit that was tested.
rustls = { git = "https://github.com/maxeliseyev/rustls.git", rev = "2f338cae" }
