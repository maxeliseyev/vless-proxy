[package]
name = "vproxy"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["rustls-tls"] }
rustls = "0.23"
tokio-rustls = "0.26"
rustls-native-certs = "0.8"
webpki-roots = "0.26"
