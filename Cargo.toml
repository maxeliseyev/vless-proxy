[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/server", "crates/ffi"]
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.17.1"
edition = "2021"

[patch.crates-io]
# vproxy fork of rustls 0.23: adds ClientConfig::session_id_hook (REALITY) and
# ClientConfig::client_hello_rewriter (Chrome TLS fingerprint).
# Branch reality-0.23, pinned to the commit that was tested.
rustls = { git = "https://github.com/maxeliseyev/rustls.git", rev = "7df70d14" }

# The iOS static library (scripts/build-xcframework.sh): smaller and a bit
# faster than plain release, without slowing down desktop release builds.
[profile.ios]
inherits = "release"
lto = "thin"
codegen-units = 1
