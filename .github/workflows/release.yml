name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-14
            target: x86_64-apple-darwin
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: linux-x86_64-musl
            os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            musl: true
          - name: linux-arm64-musl
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        run: target/${{ matrix.target }}/release/vproxy --version
      - name: Package
        run: |
          set -eu
          pkg="vproxy-${{ matrix.name }}"
          mkdir -p "dist/$pkg"
          cp "target/${{ matrix.target }}/release/vproxy" "dist/$pkg/"
          cp README.md ROADMAP.md config.toml install.sh "dist/$pkg/"
          cp -r docs "dist/$pkg/docs"
          tar -C dist -czf "dist/$pkg.tar.gz" "$pkg"
          (cd dist && shasum -a 256 "$pkg.tar.gz" > "$pkg.tar.gz.sha256")
          cat "dist/$pkg.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true

  docker:
    name: docker image (ghcr.io)
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Unpack static binaries
        run: |
          set -eu
          mkdir -p dist/amd64 dist/arm64
          tar -xzf artifacts/vproxy-linux-x86_64-musl.tar.gz -C dist/amd64 --strip-components=1 vproxy-linux-x86_64-musl/vproxy
          tar -xzf artifacts/vproxy-linux-arm64-musl.tar.gz -C dist/arm64 --strip-components=1 vproxy-linux-arm64-musl/vproxy
          ls -la dist/*
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "tags=ghcr.io/${{ github.repository_owner }}/vproxy:${version},ghcr.io/${{ github.repository_owner }}/vproxy:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
