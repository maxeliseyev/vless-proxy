[package]
name = "vproxy-server"
version = "0.1.0"
edition = "2021"
description = "Server side of the vproxy h3 (QUIC) transport"
publish = false

[[bin]]
name = "vproxy-server"
path = "src/main.rs"

[dependencies]
vproxy = { path = "..", default-features = false }
tokio = { version = "1", features = ["full"] }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls = "0.23"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
uuid = { version = "1", features = ["serde"] }
sha2 = "0.10"

[dev-dependencies]
rcgen = "0.13"
