[package]
name = "vproxy-ffi"
version = "0.1.0"
edition = "2021"
description = "C ABI over the vproxy core for the Ratatosk iOS Packet Tunnel"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
vproxy = { path = "..", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
serde_json = "1"

[dev-dependencies]
etherparse = "0.20"
